[project]
name = "calidad-blindaje"
version = "1.0.0"
description = "Trabajo Practico Semana 3: Automatizacion de Calidad y Blindaje"
requires-python = ">=3.11"
dependencies = []

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
extend-exclude = ["auditoria"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["calidad"]
